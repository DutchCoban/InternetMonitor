<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <!-- 5-puntige ster, punt omhoog, gecentreerd op (0,0) -->
    <path id="s" fill="#FFCC00" d="M0,-9 L2.12,-2.91 L8.56,-2.78 L3.42,1.11 L5.29,7.28 L0,3.6 L-5.29,7.28 L-3.42,1.11 L-8.56,-2.78 L-2.12,-2.91 Z"/>
  </defs>
  <!-- tekstbalk -->
  <rect x="170" y="45" width="300" height="110" rx="22" fill="#003399"/>
  <text x="322" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#FFFFFF" letter-spacing="2">MADE IN</text>
  <text x="322" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF" letter-spacing="1">EUROPE</text>
  <!-- embleem -->
  <circle cx="100" cy="100" r="100" fill="#003399"/>
  <g>
    <use xlink:href="#s" transform="rotate(0 100 100) translate(100 30) rotate(0)"/>
    <use xlink:href="#s" transform="rotate(30 100 100) translate(100 30) rotate(-30)"/>
    <use xlink:href="#s" transform="rotate(60 100 100) translate(100 30) rotate(-60)"/>
    <use xlink:href="#s" transform="rotate(90 100 100) translate(100 30) rotate(-90)"/>
    <use xlink:href="#s" transform="rotate(120 100 100) translate(100 30) rotate(-120)"/>
    <use xlink:href="#s" transform="rotate(150 100 100) translate(100 30) rotate(-150)"/>
    <use xlink:href="#s" transform="rotate(180 100 100) translate(100 30) rotate(-180)"/>
    <use xlink:href="#s" transform="rotate(210 100 100) translate(100 30) rotate(-210)"/>
    <use xlink:href="#s" transform="rotate(240 100 100) translate(100 30) rotate(-240)"/>
    <use xlink:href="#s" transform="rotate(270 100 100) translate(100 30) rotate(-270)"/>
    <use xlink:href="#s" transform="rotate(300 100 100) translate(100 30) rotate(-300)"/>
    <use xlink:href="#s" transform="rotate(330 100 100) translate(100 30) rotate(-330)"/>
  </g>
  <text x="100" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">EU</text>
</svg>
