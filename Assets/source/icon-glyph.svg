<?xml version="1.0" encoding="UTF-8"?>
<!-- Original artwork (not derived from any third-party asset): a minimal screen with a single
     rising monitoring line inside it - no stand, no extra badge shapes, chosen over an earlier,
     more detailed version specifically for legibility at 16x16 (system tray scale). The screen is
     a filled shape rather than an outline, which holds up far better than a thin stroke once
     downsampled that small.

     Bottom-right is deliberately left clear: TrayIconFactory composites a status-colour badge
     circle there at runtime, over the tray icon variant of this artwork. The screen rectangle
     (x:30-168, y:34-108 on this 200x200 grid) stays out of that corner by construction - its
     bottom edge (y=108) sits above the badge's top edge (y=112 on this grid), so the two never
     overlap regardless of the screen's horizontal extent. Palette matches the app's existing
     slate-blue/white style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .bg { fill: #2E4057; }
      .screen { fill: #FFFFFF; }
      .graph { fill: none; stroke: #4682B4; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="200" height="200" rx="34" ry="34"/>

  <!-- Screen: filled, no stand - the one shape, kept clear of the bottom-right badge zone. -->
  <rect class="screen" x="30" y="34" width="138" height="74" rx="14" ry="14"/>

  <!-- Rising monitoring graph, drawn inside the screen. -->
  <polyline class="graph" points="44,86 66,68 88,78 110,48 132,56 152,36"/>
</svg>
